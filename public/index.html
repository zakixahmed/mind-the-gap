<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mind the Gap</title>
<meta name="description" content="Which tube line is this? Three London Underground lines a day, three guesses each, with landmark hints. No London knowledge needed.">
<meta name="theme-color" content="#0f1115">
<style>
/* ===========================================================================
   Theme — the same tokens as stations.html, so the two modes look like one
   game. Every colour is a variable, for the light mode still to come.
   ========================================================================= */
:root {
  color-scheme: dark;
  --bg: #0f1115;
  --surface: #171a21;
  --surface-2: #1e222b;
  --border: #2b313c;
  --text: #e9ecf1;
  --muted: #98a0ad;
  --accent: #e32017;          /* Central line red */
  --correct: #2ea043;
  --near: #c9a227;
  --far: #4a5261;
  --radius: 12px;
  --shadow: 0 6px 24px rgba(0, 0, 0, .35);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding: 16px 16px 40px;
}

/* --------------------------------------------------------------- header -- */
header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding-block: 8px 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
h1 {
  font-size: 1.35rem;
  letter-spacing: -0.01em;
  margin: 0;
  font-weight: 700;
}
h1 .bar { color: var(--accent); font-weight: 800; }
.puzzle-no {
  font-size: .8rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.intro {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin: 0 0 12px;
  font-size: .85rem;
  color: var(--muted);
}
.intro a { color: var(--text); font-size: .8rem; white-space: nowrap; }

/* Today's three puzzles, as three pills: where you are, and how each went. */
.progress {
  display: flex;
  gap: 6px;
  margin: 0 0 12px;
}
.progress span {
  flex: 1;
  text-align: center;
  font-size: .72rem;
  font-weight: 600;
  letter-spacing: .04em;
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 3px 0;
}
.progress .current { color: var(--text); border-color: var(--text); }
.progress .won { background: var(--correct); border-color: var(--correct); color: #fff; }
.progress .lost { background: var(--far); border-color: var(--far); color: #fff; }

/* ------------------------------------------------------------------ map -- */
.map-frame {
  --crop-m: 10000;           /* set per line from public/data/lines.json */
  --scale-m: 2000;
  position: relative;
  aspect-ratio: 1;
  width: min(100%, 52vh);
  margin-inline: auto;
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface-2);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.map-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: opacity .25s ease;
}
.map-frame.swapping img { opacity: .35; }

.map-scale {
  --inset: 10px;
  position: absolute;
  left: var(--inset);
  right: var(--inset);
  bottom: 9px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  align-items: flex-start;
  pointer-events: none;
}
.map-scale .bar {
  width: calc((100% + var(--inset) * 2) * var(--scale-m) / var(--crop-m));
  height: 0;
  border-bottom: 3px solid rgba(20, 22, 28, .78);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .6);
}
.map-scale .label {
  font-size: .68rem;
  font-weight: 600;
  letter-spacing: .04em;
  color: #14161c;
  background: rgba(255, 255, 255, .72);
  border-radius: 4px;
  padding: 0 5px;
}
.map-north {
  position: absolute;
  right: 10px;
  bottom: 9px;
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  font-size: .7rem;
  font-weight: 700;
  color: #14161c;
  background: rgba(255, 255, 255, .72);
  border-radius: 50%;
  pointer-events: none;
}
.map-north::before {
  content: "";
  position: absolute;
  top: 2px;
  border: 4px solid transparent;
  border-bottom-color: #14161c;
  border-top-width: 0;
}
.map-north span { margin-top: 7px; }

/* The caption is as wide as the map frame, so its two labels line up with the
   map's edges rather than floating in the column (a v2 desktop quirk). */
.map-caption {
  width: min(100%, 52vh);
  margin: 8px auto 0;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: .78rem;
  color: var(--muted);
}

/* ---------------------------------------------------------------- hints -- */
#hints {
  list-style: none;
  margin: 14px 0 0;
  padding: 0;
  display: grid;
  gap: 6px;
}
#hints li {
  display: flex;
  gap: 10px;
  align-items: baseline;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 8px 11px;
  font-size: .9rem;
  animation: pop .22s ease;
}
#hints .label {
  color: var(--muted);
  font-size: .72rem;
  text-transform: uppercase;
  letter-spacing: .06em;
  min-width: 68px;
  flex-shrink: 0;
}
#hints li.locked { background: none; border: none; padding: 0; display: block; }
.hint-reveal {
  display: flex;
  gap: 10px;
  align-items: baseline;
  width: 100%;
  font: inherit;
  font-size: .9rem;
  text-align: left;
  color: var(--muted);
  background: var(--surface-2);
  border: 1px dashed var(--border);
  border-radius: 9px;
  padding: 8px 11px;
  cursor: pointer;
}
.hint-reveal:hover, .hint-reveal:focus-visible { border-style: solid; color: var(--text); }
.hint-reveal .tap { font-size: .8rem; }
@keyframes pop { from { opacity: 0; transform: translateY(-4px); } }

/* --------------------------------------------------------------- guesses -- */
#guesses {
  list-style: none;
  margin: 12px 0 0;
  padding: 0;
  display: grid;
  gap: 6px;
}
#guesses li {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 8px 11px;
  background: var(--surface);
  font-size: .95rem;
}
.dot { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; background: var(--far); }
.dot.correct { background: var(--correct); }
.dot.near { background: var(--near); }
.guess-note { margin-left: auto; font-size: .75rem; color: var(--muted); }

/* --------------------------------------------------------- line buttons -- */
/* Deliberately uncoloured. The map already shows the route's colour; colouring
   the answers too would turn the puzzle into matching two swatches. Knowing
   which colour belongs to which name is part of the game (ADR-025). */
.choices {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
  margin-top: 14px;
}
.choice {
  font: inherit;
  font-size: .92rem;
  font-weight: 600;
  color: var(--text);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 9px 8px;
  cursor: pointer;
  text-align: center;
  line-height: 1.25;
}
.choice:hover:not(:disabled), .choice:focus-visible { border-color: var(--text); }
.choice:disabled { opacity: .35; cursor: default; text-decoration: line-through; }
.choices-hint { font-size: .78rem; color: var(--muted); margin: 8px 2px 0; }

/* ---------------------------------------------------------- result card -- */
.card {
  margin-top: 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  padding: 16px;
  animation: pop .3s ease;
}
.card h2 { margin: 0 0 6px; font-size: 1.1rem; }
.card p { margin: 0 0 12px; font-size: .92rem; color: #cfd5de; }
.answer-line {
  display: inline-block;
  font-size: 1.3rem;
  font-weight: 700;
  border-radius: 8px;
  padding: 2px 12px;
  margin: 2px 0 10px;
}
/* The fun fact: set apart from the dry facts above it, so it reads as a treat. */
.funfact {
  margin: 0 0 12px;
  padding: 10px 12px;
  border-left: 3px solid var(--answer-colour, var(--accent));
  background: var(--surface-2);
  border-radius: 0 9px 9px 0;
  font-size: .92rem;
  color: var(--text);
}
.funfact b {
  display: block;
  font-size: .7rem;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--muted);
  margin-bottom: 2px;
}
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
.btn {
  font: inherit;
  font-size: .87rem;
  font-weight: 600;
  color: var(--text);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 10px 14px;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; font-weight: 500; }

.day-rows { display: grid; gap: 5px; margin: 4px 0 12px; }
.day-row { display: flex; align-items: center; gap: 10px; font-size: .9rem; }
.day-row .swatch { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
.day-row .squares { margin-left: auto; letter-spacing: 2px; }

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}
.stat { text-align: center; }
.stat b { display: block; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.dist { margin-top: 12px; display: grid; gap: 3px; }
.dist-row { display: flex; align-items: center; gap: 8px; font-size: .78rem; }
.dist-n { color: var(--muted); width: 12px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.dist-bar {
  background: var(--far);
  border-radius: 4px;
  padding: 1px 7px;
  text-align: right;
  min-width: 26px;
  font-variant-numeric: tabular-nums;
}
.countdown { margin-top: 14px; font-size: .8rem; color: var(--muted); text-align: center; }
.countdown span { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; }
.note { font-size: .8rem; color: var(--muted); margin: 10px 0 0; }

#mode-badge {
  display: inline-block;
  font-size: .64rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: #fff;
  background: var(--accent);
  border-radius: 999px;
  padding: 2px 8px;
  vertical-align: middle;
  margin-left: 8px;
}

footer {
  margin-top: 28px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  font-size: .72rem;
  color: var(--muted);
}
footer a { color: var(--muted); }

@media (min-width: 720px) {
  .wrap { max-width: 620px; padding-top: 28px; }
  h1 { font-size: 1.6rem; }
  .choices { grid-template-columns: repeat(3, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Mind the <span class="bar">Gap</span><span id="mode-badge" hidden>Practice</span></h1>
    <div class="puzzle-no" id="puzzle-no"></div>
  </header>

  <p class="intro">
    <span>Which tube line is this?</span>
    <a href="stations.html">Hard mode: stations →</a>
  </p>

  <div class="progress" id="progress" aria-label="Today's three lines"></div>

  <main>
    <div class="map-frame" id="map-frame">
      <img id="map" alt="A blurred map of London with one tube line drawn over it" src="" width="1024" height="1024">
      <div class="map-scale" aria-hidden="true"><span class="bar"></span><span class="label" id="scale-label"></span></div>
      <div class="map-north" aria-hidden="true"><span>N</span></div>
    </div>
    <div class="map-caption">
      <span id="level-label"></span>
      <span id="remaining"></span>
    </div>

    <ul id="hints" aria-label="Hints"></ul>
    <ol id="guesses" aria-label="Your guesses"></ol>

    <div id="choices-wrap">
      <div class="choices" id="choices" role="group" aria-label="Choose a line"></div>
      <p class="choices-hint">Pick the line. Three guesses — a wrong one sharpens the map and unlocks another hint.</p>
    </div>

    <section class="card" id="result" hidden aria-live="polite"></section>
  </main>

  <footer>
    Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors,
    <a href="https://opendatacommons.org/licenses/odbl/" target="_blank" rel="noopener">ODbL</a>.
    Line and station data © Transport for London — Powered by TfL Open Data.
  </footer>

</div>

<script>
"use strict";
/* ===========================================================================
   Mind the Gap v3 — the line game (ADR-025).

   Three lines a day, the same three for everyone, played back to back. Each
   shows the whole route in its real colour; three guesses; a wrong guess
   sharpens the map and unlocks a landmark hint. One share grid for the day.

   The station game lives on, unchanged, at stations.html as hard mode, with
   its own storage keys — a v2 player's stats are untouched.
   ========================================================================= */

const MAX_GUESSES = 3;
const PER_DAY = 3;
const LAUNCH = "2026-09-29";          // day #1 of the line game
const DECK_SEED = 20260929;

const STORE = { day: "mtg:lines:day", stats: "mtg:lines:stats", recent: "mtg:lines:recent" };
const SQUARES = { correct: "\u{1F7E9}", near: "\u{1F7E8}", far: "\u{2B1B}" };
const VERDICT_NOTE = { correct: "", near: "same part of London", far: "nowhere near it" };

const state = {
  lines: {}, hints: {}, facts: {}, ids: [], stationsOf: {}, coordsOf: {}, adjacent: {},
  day: 0,
  today: [],             // the day's three line ids
  idx: 0,                // which of the three is on screen
  results: [],           // per puzzle: { guesses, status, revealed }
  mode: "daily",         // "daily" | "practice"
  practice: null,        // { line, guesses, status, revealed }
};

const $ = (id) => document.getElementById(id);

/* ------------------------------------------------------- dates & seeding -- */

function londonDate(when = new Date()) {
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: "Europe/London", year: "numeric", month: "2-digit", day: "2-digit",
  }).format(when);
}

function daysBetween(fromISO, toISO) {
  const [y1, m1, d1] = fromISO.split("-").map(Number);
  const [y2, m2, d2] = toISO.split("-").map(Number);
  return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 86400000);
}

/** Milliseconds until the London date changes. Bisection, not "+24 h", because
 *  on clock-change days tomorrow's midnight is 23 or 25 hours away. */
function msUntilNextLondonDay() {
  const now = Date.now();
  const today = londonDate(new Date(now));
  let lo = now, hi = now + 26 * 3600 * 1000;
  while (hi - lo > 500) {
    const mid = Math.floor((lo + hi) / 2);
    if (londonDate(new Date(mid)) === today) lo = mid; else hi = mid;
  }
  return hi - now;
}

/** Small deterministic PRNG, so every player's browser deals the same deck. */
function mulberry32(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** The three lines for day ``n``.
 *
 *  Lines are dealt from shuffled decks of all eleven, so every line comes up
 *  once per eleven puzzles rather than whenever a dice roll allows — no line
 *  vanishes for a fortnight, none turns up three days running. When a day
 *  straddles two decks, a line already dealt that day is skipped for the next
 *  card, so a day never repeats a line. The deal is replayed from day 1 each
 *  time; at three cards a day that is a few thousand steps even years in.
 */
function linesForDay(n) {
  const rng = mulberry32(DECK_SEED);
  const deck = [];
  const refill = () => {
    const fresh = state.ids.slice();
    for (let i = fresh.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [fresh[i], fresh[j]] = [fresh[j], fresh[i]];
    }
    deck.push(...fresh);
  };
  for (let d = 1; d <= n; d++) {
    const picks = [];
    while (picks.length < PER_DAY) {
      if (deck.length < state.ids.length) refill();
      const i = deck.findIndex((id) => !picks.includes(id));
      picks.push(deck.splice(i, 1)[0]);
    }
    if (d === n) return picks;
  }
  return [];
}

/* ----------------------------------------------------------- local store -- */

function load(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* full or blocked */ }
}

function blankStats() {
  return { puzzles: 0, solved: 0, dist: [0, 0, 0], streak: 0, maxStreak: 0, lastDay: null };
}

function saveDay() {
  save(STORE.day, { day: state.day, idx: state.idx, results: state.results });
}

/** Fold a finished day into the stats, exactly once. The streak counts days
 *  played in a row — all three lines finished, solved or not. */
function recordDay() {
  const stats = load(STORE.stats, blankStats());
  if (stats.lastDay === state.day) return;
  for (const r of state.results) {
    stats.puzzles += 1;
    if (r.status === "won") { stats.solved += 1; stats.dist[r.guesses.length - 1] += 1; }
  }
  stats.streak = stats.lastDay === state.day - 1 ? stats.streak + 1 : 1;
  stats.maxStreak = Math.max(stats.maxStreak, stats.streak);
  stats.lastDay = state.day;
  save(STORE.stats, stats);
}

/* --------------------------------------------------------------- helpers -- */

function readableOn(hex) {
  const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
  return (0.2126 * r + 0.7152 * g + 0.0722 * b) > 0.55 ? "#101216" : "#ffffff";
}

function lineLabel(id) { return `${state.lines[id].name} line`; }

/** The puzzle on screen: today's current one, or a practice round. */
function current() {
  if (state.mode === "practice") return state.practice;
  return { line: state.today[state.idx], ...state.results[state.idx] };
}
function mutable() {
  return state.mode === "practice" ? state.practice : state.results[state.idx];
}

function dayFinished() {
  return state.results.every((r) => r.status !== "playing");
}

/** 🟩 right · 🟨 the guessed line shares at least one station with the answer · ⬛ none. */
/* How close a wrong guess was. Rewritten in v0.3.1 because the first version
 * — "do these two lines share any station at all?" — turned out to carry
 * almost no information. 48 of the 55 line pairs share a station, so 87% of
 * wrong guesses came back yellow, and six of the seven exceptions involve the
 * two-stop Waterloo & City line. A black square did not mean "nowhere near";
 * it meant "you guessed Waterloo & City". A share grid of near-identical
 * yellow rows tells the person reading it nothing, which defeats the point of
 * borrowing Wordle's grid in the first place.
 *
 * Eleven lines crossing one city nearly all touch somewhere, so touching is
 * the wrong question. Two tests replace it, either of which counts as near:
 *
 *   1. The lines run alongside each other — they share a stretch of at least
 *      three consecutive stops, not just an interchange where they cross.
 *   2. At least half the guessed line sits within 1.5 km of the answer's
 *      route, i.e. it covers the same part of London.
 *
 * Together these are yellow for 32% of wrong guesses rather than 87%, and a
 * yellow now tells a player something they can act on: you are in the right
 * part of town. Note that test 2 is deliberately asymmetric — it asks how much
 * of *your guess* lies near the answer — so guessing a short central line
 * against a long one is near, while the reverse is not. That is the more
 * useful reading: it says your guess is inside the answer's territory. */
const NEAR_KM = 1.5;        // "the same part of London", roughly a 20-minute walk
const NEAR_SHARE = 0.5;     // how much of the guess has to be that close
const ALONGSIDE = 3;        // consecutive shared stops that count as running together

function kmBetween(a, b) {
  // Flat-earth; over a few km across London the error is far below the
  // threshold this feeds, and it avoids a haversine for no gain.
  return Math.hypot((b.lat - a.lat) * 110.54,
                    (b.lon - a.lon) * 111.32 * Math.cos(a.lat * Math.PI / 180));
}

/** Longest chain of shared stations that are adjacent on the network. */
function longestSharedRun(guess, answer) {
  const theirs = state.stationsOf[answer];
  const shared = new Set([...state.stationsOf[guess]].filter((s) => theirs.has(s)));
  const seen = new Set();
  let best = 0;
  for (const start of shared) {
    if (seen.has(start)) continue;
    seen.add(start);
    const stack = [start];
    let size = 0;
    while (stack.length) {
      const cur = stack.pop();
      size++;
      for (const n of state.adjacent[cur] || []) {
        if (shared.has(n) && !seen.has(n)) { seen.add(n); stack.push(n); }
      }
    }
    best = Math.max(best, size);
  }
  return best;
}

const verdictCache = new Map();   // verdict() runs on every render; the answer never changes

function verdict(guess, answer) {
  if (guess === answer) return "correct";
  const key = `${guess}|${answer}`;
  if (verdictCache.has(key)) return verdictCache.get(key);

  let result = "far";
  if (longestSharedRun(guess, answer) >= ALONGSIDE) {
    result = "near";
  } else {
    const theirs = state.coordsOf[answer];
    const mine = state.coordsOf[guess];
    const close = mine.filter((a) => theirs.some((b) => kmBetween(a, b) <= NEAR_KM)).length;
    if (close / mine.length >= NEAR_SHARE) result = "near";
  }
  verdictCache.set(key, result);
  return result;
}

/** A scale bar about a fifth of the frame wide, in a round number of km. */
function scaleFor(spanM) {
  const steps = [500, 1000, 2000, 5000, 10000];
  let pick = steps[0];
  for (const s of steps) if (s <= spanM * 0.25) pick = s;
  return { metres: pick, label: pick < 1000 ? `${pick} m` : `${pick / 1000} km` };
}

/* ------------------------------------------------------------ rendering --- */

function renderHeader() {
  $("mode-badge").hidden = state.mode !== "practice";
  $("puzzle-no").textContent = state.mode === "practice" ? "" : `Day #${state.day}`;
  const prog = $("progress");
  prog.hidden = state.mode === "practice";
  prog.innerHTML = state.results.map((r, i) => {
    const cls = r.status !== "playing" ? r.status : (i === state.idx ? "current" : "");
    const mark = r.status === "won" ? "✓" : r.status === "lost" ? "✗" : "";
    return `<span class="${cls}">Line ${i + 1} ${mark}</span>`;
  }).join("");
}

function renderMap() {
  const p = current();
  const level = p.status !== "playing" ? MAX_GUESSES : Math.min(p.guesses.length + 1, MAX_GUESSES);
  const next = `lines/${p.line}/${level}.webp`;
  const frame = $("map-frame"), map = $("map");
  if (map.getAttribute("src") !== next) {
    frame.classList.add("swapping");
    const img = new Image();
    img.onload = img.onerror = () => { map.src = next; frame.classList.remove("swapping"); };
    img.src = next;
  }
  const span = state.lines[p.line].span_m;
  const scale = scaleFor(span);
  frame.style.setProperty("--crop-m", span);
  frame.style.setProperty("--scale-m", scale.metres);
  $("scale-label").textContent = scale.label;
  $("level-label").textContent = `Blur level ${level} of ${MAX_GUESSES}`;
  const left = MAX_GUESSES - p.guesses.length;
  $("remaining").textContent = p.status !== "playing" ? "" : `${left} guess${left === 1 ? "" : "es"} left`;
  if (level < MAX_GUESSES) new Image().src = `lines/${p.line}/${level + 1}.webp`;
}

/* Hints sit face down and are turned over by tapping: the player chooses when
 * to take help, as in v2. What changed in v0.3.1 is *when* they become
 * available (round-3 feedback, docs/versions/v3/FEEDBACK.md).
 *
 * Previously every rung was locked until a wrong guess, which meant that with
 * only three guesses a player had to spend one before any help existed. A
 * tester put it plainly: they wanted "a little more information on the map"
 * from the start. So the first two rungs are open immediately and the third is
 * the one a wrong guess buys.
 *
 * The first rung is the line's station count. That number used to appear only
 * on the result card, after the answer — the same tester noticed it there and
 * read it as a clue that had arrived too late, which it was. It is a good
 * opening clue precisely because it needs no London knowledge: it narrows
 * eleven lines without naming a single place. */
function renderHints() {
  const p = current();
  const h = state.hints[p.line];
  const count = state.lines[p.line].stations;
  const ladder = [
    { label: "Stops", text: `This line has <strong>${count}</strong> stations.` },
    { label: "Landmark", text: h.first },
    { label: "More", text: h.second },
  ];
  const FREE = 2;  // open from the start; the rest are bought with wrong guesses
  const unlocked = Math.min(FREE + p.guesses.filter((g) => g !== p.line).length, ladder.length);
  const list = $("hints");
  list.innerHTML = "";
  for (let i = 0; i < unlocked; i++) {
    const li = document.createElement("li");
    if (p.revealed.includes(i) || p.status !== "playing") {
      li.innerHTML = `<span class="label">${ladder[i].label}</span><span>${ladder[i].text}</span>`;
    } else {
      li.className = "locked";
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "hint-reveal";
      btn.innerHTML = `<span class="label">${ladder[i].label}</span><span class="tap">Tap to reveal</span>`;
      btn.addEventListener("click", () => {
        mutable().revealed.push(i);
        if (state.mode === "daily") saveDay();
        renderHints();
      });
      li.appendChild(btn);
    }
    list.appendChild(li);
  }
}

function renderGuesses() {
  const p = current();
  const list = $("guesses");
  list.innerHTML = "";
  for (const g of p.guesses) {
    const v = verdict(g, p.line);
    const li = document.createElement("li");
    li.innerHTML = `<span class="dot ${v}"></span><span>${lineLabel(g)}</span><span class="guess-note">${VERDICT_NOTE[v]}</span>`;
    list.appendChild(li);
  }
}

function renderChoices() {
  const p = current();
  $("choices-wrap").hidden = p.status !== "playing";
  const box = $("choices");
  box.innerHTML = "";
  for (const id of state.ids) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "choice";
    b.textContent = state.lines[id].name;
    b.disabled = p.guesses.includes(id);
    b.addEventListener("click", () => guess(id));
    box.appendChild(b);
  }
}

function statsMarkup() {
  const s = load(STORE.stats, blankStats());
  const pct = s.puzzles ? Math.round((s.solved / s.puzzles) * 100) : 0;
  const lost = s.puzzles - s.solved;
  const most = Math.max(1, ...s.dist, lost);
  const bar = (label, n) => `<div class="dist-row"><span class="dist-n">${label}</span>` +
    `<span class="dist-bar" style="width:${Math.max(6, (n / most) * 100)}%">${n}</span></div>`;
  return `
    <div class="stats">
      <div class="stat"><b>${s.puzzles}</b><span>played</span></div>
      <div class="stat"><b>${pct}%</b><span>solved</span></div>
      <div class="stat"><b>${s.streak}</b><span>day streak</span></div>
      <div class="stat"><b>${s.maxStreak}</b><span>best</span></div>
    </div>
    <div class="dist">${s.dist.map((n, i) => bar(i + 1, n)).join("")}${bar("✗", lost)}</div>`;
}

function renderResult() {
  const p = current();
  const card = $("result");
  if (p.status === "playing") { card.hidden = true; return; }

  const line = state.lines[p.line];
  const h = state.hints[p.line];
  const n = p.guesses.length;
  const heading = p.status === "won" ? (n === 1 ? "First guess!" : `Got it in ${n}.`) : "Out of guesses.";
  let html = `
    <h2>${heading}</h2>
    <div class="answer-line" style="background:${line.colour};color:${readableOn(line.colour)}">${lineLabel(p.line)}</div>
    <p>The ${line.name} line has ${line.stations} station${line.stations === 1 ? "" : "s"}. ${h.first}. ${h.second}.</p>
    ${state.facts[p.line] ? `<div class="funfact" style="--answer-colour:${line.colour}"><b>Fun fact</b>${state.facts[p.line].text}</div>` : ""}`;

  if (state.mode === "practice") {
    html += `<div class="actions">
      <button class="btn primary" id="again-btn">Another random line</button>
      <button class="btn ghost" id="back-btn">Back to today</button></div>
      <p class="note">Practice rounds don't count towards your stats.</p>`;
  } else if (!dayFinished()) {
    html += `<div class="actions"><button class="btn primary" id="next-btn">Next line →</button></div>`;
  } else {
    const solved = state.results.filter((r) => r.status === "won").length;
    const rows = state.today.map((id, i) => {
      const r = state.results[i];
      const sq = r.guesses.map((g) => SQUARES[verdict(g, id)]).join("");
      return `<div class="day-row"><span class="swatch" style="background:${state.lines[id].colour}"></span>` +
             `${lineLabel(id)}<span class="squares">${sq}</span></div>`;
    }).join("");
    html += `
      <h2 style="margin-top:14px">Today: ${solved} of ${PER_DAY}</h2>
      <div class="day-rows">${rows}</div>
      <div class="actions">
        <button class="btn primary" id="share-btn">Share result</button>
        <button class="btn" id="practice-btn">Play a random line</button>
      </div>
      ${statsMarkup()}
      <div class="countdown">Next three lines in <span id="countdown">…</span></div>`;
  }
  card.innerHTML = html;
  card.hidden = false;

  const on = (id, fn) => { const el = $(id); if (el) el.addEventListener("click", fn); };
  on("next-btn", nextPuzzle);
  on("share-btn", share);
  on("practice-btn", startPractice);
  on("again-btn", startPractice);
  on("back-btn", backToDaily);
  if ($("countdown")) tickCountdown();
}

function render() {
  renderHeader();
  renderMap();
  renderHints();
  renderGuesses();
  renderChoices();
  renderResult();
}

/* ------------------------------------------------------------ game flow --- */

function guess(id) {
  const p = mutable();
  const answer = current().line;
  if (p.status !== "playing" || p.guesses.includes(id)) return;
  p.guesses.push(id);
  if (id === answer) p.status = "won";
  else if (p.guesses.length >= MAX_GUESSES) p.status = "lost";
  if (state.mode === "daily") {
    if (dayFinished()) recordDay();
    saveDay();
  }
  render();
  if (p.status !== "playing") $("result").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function nextPuzzle() {
  const i = state.results.findIndex((r) => r.status === "playing");
  if (i < 0) return;
  state.idx = i;
  saveDay();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function startPractice() {
  const recent = load(STORE.recent, []);
  let pool = state.ids.filter((id) => !recent.includes(id));
  if (!pool.length) pool = state.ids;
  const line = pool[Math.floor(Math.random() * pool.length)];
  save(STORE.recent, [line, ...recent].slice(0, 5));
  state.mode = "practice";
  state.practice = { line, guesses: [], status: "playing", revealed: [] };
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function backToDaily() {
  state.mode = "daily";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* --------------------------------------------------------------- sharing -- */

/* A row ends in 💡 if any hint was turned over for that line. Once help is
 * free for the asking it has to be visible, or solving it unaided — which is
 * the harder, better game — looks identical to being handed the answer. */
function shareText() {
  const solved = state.results.filter((r) => r.status === "won").length;
  const rows = state.today.map((id, i) => {
    const r = state.results[i];
    return r.guesses.map((g) => SQUARES[verdict(g, id)]).join("") + (r.revealed.length ? " \u{1F4A1}" : "");
  }).join("\n");
  return `Mind the Gap — lines, day #${state.day}: ${solved}/${PER_DAY}\n${rows}\n${location.origin}${location.pathname}`;
}

async function share() {
  const text = shareText();
  const btn = $("share-btn");
  try {
    if (navigator.share) { await navigator.share({ text }); return; }
    await navigator.clipboard.writeText(text);
    btn.textContent = "Copied!";
  } catch (err) {
    if (err && err.name === "AbortError") return;
    btn.textContent = "Press Ctrl+C";
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    setTimeout(() => ta.remove(), 8000);
    return;
  }
  setTimeout(() => { if ($("share-btn")) $("share-btn").textContent = "Share result"; }, 2000);
}

let countdownTimer = null;
function tickCountdown() {
  clearInterval(countdownTimer);
  const paint = () => {
    const el = $("countdown");
    if (!el) { clearInterval(countdownTimer); return; }
    const ms = msUntilNextLondonDay();
    const h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60, s = Math.floor(ms / 1000) % 60;
    el.textContent = [h, m, s].map((v) => String(v).padStart(2, "0")).join(":");
  };
  paint();
  countdownTimer = setInterval(paint, 1000);
}

/* ----------------------------------------------------------------- boot --- */

async function start() {
  let lines, hints, stations, facts;
  try {
    [lines, hints, stations, facts] = await Promise.all([
      fetch("data/lines.json").then((r) => r.json()),
      fetch("data/line_hints.json").then((r) => r.json()),
      fetch("data/stations.json").then((r) => r.json()),
      // A nicety, not a requirement: the game plays fine without its facts.
      fetch("data/line_facts.json").then((r) => r.json()).catch(() => ({ facts: {} })),
    ]);
  } catch (err) {
    document.querySelector(".choices-hint").textContent =
      "Could not load the puzzle data. If you opened this file directly, serve it instead: python3 -m http.server";
    console.error(err);
    return;
  }

  state.lines = lines.lines;
  state.hints = hints.hints;
  state.facts = facts.facts || {};
  // Alphabetical, so the buttons are easy to scan and don't hint at anything.
  state.ids = Object.keys(state.lines).sort((a, b) => state.lines[a].name.localeCompare(state.lines[b].name));
  for (const id of state.ids) { state.stationsOf[id] = new Set(); state.coordsOf[id] = []; }
  for (const s of stations.stations) {
    state.adjacent[s.slug] = s.adjacent || [];
    for (const l of s.lines) {
      state.stationsOf[l]?.add(s.slug);
      state.coordsOf[l]?.push({ lat: s.lat, lon: s.lon });
    }
  }

  state.day = Math.max(1, daysBetween(LAUNCH, londonDate()) + 1);
  state.today = linesForDay(state.day);
  state.results = state.today.map(() => ({ guesses: [], status: "playing", revealed: [] }));

  // Resume today if there is a saved game; any other day's is ignored.
  const saved = load(STORE.day, null);
  if (saved && saved.day === state.day && Array.isArray(saved.results) && saved.results.length === PER_DAY) {
    state.results = saved.results.map((r) => ({
      guesses: (r.guesses || []).filter((g) => state.lines[g]),
      status: r.status === "won" || r.status === "lost" ? r.status : "playing",
      revealed: Array.isArray(r.revealed) ? r.revealed.filter(Number.isInteger) : [],
    }));
    state.idx = Math.min(PER_DAY - 1, Math.max(0, saved.idx | 0));
  }
  render();
}

start();
</script>
</body>
</html>
