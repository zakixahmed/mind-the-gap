<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mind the Gap</title>
<meta name="description" content="A daily puzzle: guess the London Underground station from a blurred map.">
<meta name="theme-color" content="#0f1115">
<style>
/* ===========================================================================
   Theme. Dark by default; the light toggle lands in phase 6, which is why
   every colour is a variable rather than a literal.
   ========================================================================= */
:root {
  color-scheme: dark;
  --bg: #0f1115;
  --surface: #171a21;
  --surface-2: #1e222b;
  --border: #2b313c;
  --text: #e9ecf1;
  --muted: #98a0ad;
  --accent: #e32017;          /* Central line red */
  --correct: #2ea043;
  --near: #c9a227;
  --far: #4a5261;
  --radius: 12px;
  --shadow: 0 6px 24px rgba(0, 0, 0, .35);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding: 16px 16px 40px;
}

/* --------------------------------------------------------------- header -- */
header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding-block: 8px 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}
h1 {
  font-size: 1.35rem;
  letter-spacing: -0.01em;
  margin: 0;
  font-weight: 700;
}
h1 .bar {                      /* the roundel-ish bar through the title */
  color: var(--accent);
  font-weight: 800;
}
.puzzle-no {
  font-size: .8rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* ------------------------------------------------------------------ map -- */
.map-frame {
  position: relative;
  aspect-ratio: 1;
  /* Square, but never so tall that the search box falls below the fold on a
     phone — the whole loop has to be reachable without scrolling. */
  width: min(100%, 52vh);
  margin-inline: auto;
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface-2);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.map-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  /* Levels 1-3 are stored small on purpose (see ADR-009); let the browser
     scale them smoothly rather than showing enlarged pixels. */
  image-rendering: auto;
  transition: opacity .25s ease;
}
.map-frame.swapping img { opacity: .35; }

/* The station is dead centre of every crop. Saying so costs nothing and
   saves the player wondering. */
.centre-mark {
  position: absolute;
  inset: 50% auto auto 50%;
  width: 26px;
  height: 26px;
  margin: -13px 0 0 -13px;
  border: 2px solid rgba(227, 32, 23, .9);
  border-radius: 50%;
  box-shadow: 0 0 0 2px rgba(255, 255, 255, .55);
  pointer-events: none;
}
.centre-mark::after {
  content: "";
  position: absolute;
  inset: 50% auto auto 50%;
  width: 4px; height: 4px; margin: -2px 0 0 -2px;
  background: rgba(227, 32, 23, .9);
  border-radius: 50%;
}

.map-caption {
  width: min(100%, 52vh);
  margin-inline: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  font-size: .78rem;
  color: var(--muted);
  margin: 8px 2px 0;
}

/* ---------------------------------------------------------------- hints -- */
#hints {
  list-style: none;
  margin: 16px 0 0;
  padding: 0;
  display: grid;
  gap: 6px;
}
#hints li {
  display: flex;
  gap: 10px;
  align-items: baseline;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 8px 11px;
  font-size: .9rem;
  animation: pop .22s ease;
}
#hints .label {
  color: var(--muted);
  font-size: .72rem;
  text-transform: uppercase;
  letter-spacing: .06em;
  min-width: 68px;
  flex-shrink: 0;
}
@keyframes pop { from { opacity: 0; transform: translateY(-4px); } }

/* Line names are shown in their own colours — it is a strong, familiar cue. */
.line-chip {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: .8rem;
  font-weight: 600;
  margin: 0 4px 4px 0;
  white-space: nowrap;
}

/* --------------------------------------------------------------- guesses -- */
#guesses {
  list-style: none;
  margin: 16px 0 0;
  padding: 0;
  display: grid;
  gap: 6px;
}
#guesses li {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 9px 11px;
  background: var(--surface);
  font-size: .95rem;
  min-height: 42px;
}
#guesses li.empty {
  background: transparent;
  border-style: dashed;
  opacity: .35;
  min-height: 34px;
  font-size: .82rem;
  color: var(--muted);
}
.dot {
  width: 14px; height: 14px;
  border-radius: 4px;
  flex-shrink: 0;
  background: var(--far);
}
.dot.correct { background: var(--correct); }
.dot.near    { background: var(--near); }
.guess-note {
  margin-left: auto;
  font-size: .75rem;
  color: var(--muted);
}

/* ---------------------------------------------------------------- search -- */
.search {
  position: relative;
  margin-top: 18px;
}
#guess-input {
  width: 100%;
  padding: 13px 14px;
  font-size: 1rem;              /* 16px min, or iOS zooms the page on focus */
  color: var(--text);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  outline: none;
}
#guess-input:focus { border-color: var(--accent); }
#guess-input:disabled { opacity: .5; }

/* On a phone the on-screen keyboard covers everything under the input, so the
   list opens upward. On a wider screen there is room below, and opening upward
   would cover the map — which the player needs to see while choosing. */
#suggestions {
  position: absolute;
  left: 0; right: 0; bottom: calc(100% + 6px);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow);
  max-height: 260px;
  overflow-y: auto;
  z-index: 20;
  padding: 4px;
  margin: 0;
  list-style: none;
}
#suggestions li {
  padding: 10px 11px;
  border-radius: 7px;
  cursor: pointer;
  font-size: .95rem;
  display: flex;
  align-items: center;
  gap: 8px;
}
#suggestions li[aria-selected="true"], #suggestions li:hover { background: #2a303c; }
#suggestions .rail {
  width: 3px; height: 16px; border-radius: 2px; flex-shrink: 0;
}
.hint-text {
  font-size: .78rem;
  color: var(--muted);
  margin: 8px 2px 0;
  min-height: 1.2em;
}

/* ------------------------------------------------------------ end screen -- */
#endscreen {
  margin-top: 18px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  padding: 16px;
  animation: pop .3s ease;
}
#endscreen h2 { margin: 0 0 4px; font-size: 1.1rem; }
#endscreen .answer { font-size: 1.45rem; font-weight: 700; margin: 2px 0 10px; }
#endscreen p { margin: 0 0 12px; font-size: .92rem; color: #cfd5de; }
#endscreen a.osm {
  display: inline-block;
  font-size: .85rem;
  color: var(--text);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  text-decoration: none;
}
#endscreen a.osm:hover { border-color: var(--accent); }

/* --------------------------------------------------------------- footer -- */
footer {
  margin-top: 28px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  font-size: .72rem;
  color: var(--muted);
}
footer a { color: var(--muted); }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* Desktop gets a slightly larger board, but the layout stays one column:
   the game is a vertical sequence and splitting it would only add distance
   between the map and the input. */
@media (min-width: 720px) {
  .wrap { max-width: 620px; padding-top: 28px; }
  h1 { font-size: 1.6rem; }
  #suggestions { bottom: auto; top: calc(100% + 6px); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Mind the <span class="bar">Gap</span></h1>
    <div class="puzzle-no" id="puzzle-no">Puzzle #1</div>
  </header>

  <main>
    <div class="map-frame" id="map-frame">
      <img id="map" alt="A blurred map centred on the mystery station" src="" width="640" height="640">
      <div class="centre-mark" aria-hidden="true"></div>
    </div>
    <div class="map-caption">
      <span id="level-label">Blur level 1 of 6</span>
      <span id="remaining">6 guesses left</span>
    </div>

    <ul id="hints" aria-label="Hints"></ul>
    <ol id="guesses" aria-label="Your guesses"></ol>

    <div class="search">
      <ul id="suggestions" role="listbox" aria-label="Station suggestions" hidden></ul>
      <label for="guess-input" class="sr-only">Guess a station</label>
      <input id="guess-input" type="text" role="combobox" aria-expanded="false"
             aria-controls="suggestions" aria-autocomplete="list" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false"
             placeholder="Type a station name…">
    </div>
    <p class="hint-text" id="input-hint">Pick from the list — you can't enter free text.</p>

    <section id="endscreen" hidden aria-live="polite"></section>
  </main>

  <footer>
    Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors,
    <a href="https://opendatacommons.org/licenses/odbl/" target="_blank" rel="noopener">ODbL</a>.
    Station data © Transport for London — Powered by TfL Open Data.
  </footer>

</div>

<script>
"use strict";
/* ===========================================================================
   Mind the Gap — core game loop.

   Phase 4: one hardcoded puzzle. Date seeding, the share grid, stats and the
   countdown arrive in phase 5; the places they slot into are marked TODO(p5).
   ========================================================================= */

/** The puzzle. Phase 5 replaces this with days-since-launch → schedule lookup. */
const PUZZLE = { slug: "baker-street", number: 1 };

const MAX_GUESSES = 6;

/** Official TfL line colours — used for hint chips and suggestion bars. */
const LINE_COLOURS = {
  "bakerloo": "#B36305", "central": "#E32017", "circle": "#FFD300",
  "district": "#00782A", "hammersmith-city": "#F3A9BB", "jubilee": "#A0A5A9",
  "metropolitan": "#9B0056", "northern": "#000000", "piccadilly": "#003688",
  "victoria": "#0098D4", "waterloo-city": "#95CDBA",
};

/* One fact per puzzle station. Kept inline while there is exactly one; phase 5
   moves this to public/data/facts.json alongside the 100-day schedule. */
const FACTS = {
  "baker-street": "Baker Street opened in 1863 on the Metropolitan Railway, the world's first underground railway — its platforms are among the oldest still in use anywhere. The Sherlock Holmes silhouettes tiled along the walls were added in 1979.",
};

/** Mutable game state. */
const state = {
  stations: [],          // every station, as loaded
  bySlug: new Map(),
  answer: null,
  guesses: [],           // slugs, in order
  status: "playing",     // "playing" | "won" | "lost"
  highlighted: -1,       // index into the current suggestion list
  matches: [],
};

const $ = (id) => document.getElementById(id);
const els = {
  map: $("map"), mapFrame: $("map-frame"), level: $("level-label"),
  remaining: $("remaining"), hints: $("hints"), guesses: $("guesses"),
  input: $("guess-input"), suggestions: $("suggestions"), inputHint: $("input-hint"),
  end: $("endscreen"), puzzleNo: $("puzzle-no"),
};

/* --------------------------------------------------------------- helpers -- */

/** Fold case, accents and punctuation so "St. John's Wood" matches "st johns". */
function normalise(text) {
  return text
    .toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")  // strip accents
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

/** Display name for a line id, falling back to a tidied id if it is unknown. */
function lineName(id) {
  return state.lines[id] || id.replace(/-/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
}

/* Several line colours are pale — Circle yellow, Hammersmith & City pink,
   Jubilee grey, Waterloo & City turquoise — and white text on them is close to
   unreadable. Pick the text colour from the background's luminance instead of
   keeping a list in sync by hand. */
function readableOn(hex) {
  const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
  // Relative luminance, WCAG's coefficients. 0.55 is the crossover that puts
  // every TfL line on the more readable side.
  const luminance = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  return luminance > 0.55 ? "#101216" : "#ffffff";
}

function lineChip(id) {
  const colour = LINE_COLOURS[id] || "#555555";
  return `<span class="line-chip" style="background:${colour};color:${readableOn(colour)}">${lineName(id)}</span>`;
}

/* ----------------------------------------------------------- the hints ---- */

/* The ladder from the brief, in order. Each returns the HTML for one hint.
   Hint n is revealed after wrong guess n, so five hints cover guesses 1-5. */
const HINT_LADDER = [
  { label: "Zone", render: (s) => s.zones.length > 1 ? `Zones ${s.zones.join(" and ")}` : `Zone ${s.zones[0]}` },
  { label: "Line", render: (s) => s.lines.map(lineChip).join("") },
  { label: "Borough", render: (s) => s.borough },
  { label: "Starts", render: (s) => `The name starts with <strong>${s.name[0].toUpperCase()}</strong>` },
  { label: "Length", render: (s) => {
      // Count letters only: spaces, apostrophes and brackets would give away
      // more about the shape of the name than intended.
      const letters = s.name.replace(/[^a-zA-Z]/g, "").length;
      return `<strong>${letters}</strong> letters`;
    } },
];

/* ------------------------------------------------------------ rendering --- */

/** Which image to show: guess 1 sees level 1, and the answer is revealed at 6. */
function currentLevel() {
  if (state.status !== "playing") return MAX_GUESSES;
  return Math.min(state.guesses.length + 1, MAX_GUESSES);
}

function renderMap() {
  const level = currentLevel();
  const next = `maps/${state.answer.slug}/${level}.webp`;
  if (els.map.getAttribute("src") === next) return;

  // Fade out, swap once the new file has decoded, fade back in — without this
  // the sharper level pops in halfway loaded and looks like a glitch.
  els.mapFrame.classList.add("swapping");
  const img = new Image();
  img.onload = img.onerror = () => {
    els.map.src = next;
    els.mapFrame.classList.remove("swapping");
  };
  img.src = next;

  els.level.textContent = `Blur level ${level} of ${MAX_GUESSES}`;
}

function renderHints() {
  // One hint per wrong guess. A correct guess ends the game, so the count of
  // wrong guesses is simply the number of guesses made.
  const revealed = Math.min(state.guesses.length, HINT_LADDER.length);
  els.hints.innerHTML = "";
  for (let i = 0; i < revealed; i++) {
    const hint = HINT_LADDER[i];
    const li = document.createElement("li");
    li.innerHTML = `<span class="label">${hint.label}</span><span>${hint.render(state.answer)}</span>`;
    els.hints.appendChild(li);
  }
}

/** 🟩 correct · 🟨 shares a line, or one stop away · ⬛ neither. */
function verdict(slug) {
  if (slug === state.answer.slug) return "correct";
  const guess = state.bySlug.get(slug);
  const sharesLine = guess.lines.some((l) => state.answer.lines.includes(l));
  const adjacent = state.answer.adjacent.includes(slug);
  return (sharesLine || adjacent) ? "near" : "far";
}

const VERDICT_NOTE = {
  correct: "",
  near: "same line or next door",
  far: "not close",
};

function renderGuesses() {
  els.guesses.innerHTML = "";
  // Only the guesses actually made, plus a single slim placeholder for the
  // next one. Drawing all six empty rows up front pushed the search box below
  // the fold on a phone, which is the one thing that must never happen.
  for (const slug of state.guesses) {
    const v = verdict(slug);
    const li = document.createElement("li");
    li.innerHTML =
      `<span class="dot ${v}"></span>` +
      `<span>${state.bySlug.get(slug).name}</span>` +
      `<span class="guess-note">${VERDICT_NOTE[v]}</span>`;
    els.guesses.appendChild(li);
  }
  if (state.status === "playing") {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = `Guess ${state.guesses.length + 1} of ${MAX_GUESSES}`;
    els.guesses.appendChild(li);
  }
  const left = MAX_GUESSES - state.guesses.length;
  els.remaining.textContent =
    state.status !== "playing" ? "" : `${left} guess${left === 1 ? "" : "es"} left`;
}

function renderEnd() {
  if (state.status === "playing") { els.end.hidden = true; return; }
  const s = state.answer;
  const won = state.status === "won";
  const n = state.guesses.length;
  const heading = won
    ? (n === 1 ? "First guess. Extraordinary." : `Got it in ${n}.`)
    : "Out of guesses.";
  const fact = FACTS[s.slug] || "";
  // TODO(p5): share button (emoji grid), stats panel and next-puzzle countdown.
  els.end.innerHTML = `
    <h2>${heading}</h2>
    <div class="answer">${s.name}</div>
    ${fact ? `<p>${fact}</p>` : ""}
    <a class="osm" target="_blank" rel="noopener"
       href="https://www.openstreetmap.org/?mlat=${s.lat}&mlon=${s.lon}#map=16/${s.lat}/${s.lon}">
       See it on OpenStreetMap →</a>`;
  els.end.hidden = false;
}

function render() {
  renderMap();
  renderHints();
  renderGuesses();
  renderEnd();
}

/* -------------------------------------------------------- autocomplete ---- */

/** Up to 8 matches: names starting with the query first, then names containing it. */
function findMatches(query) {
  const q = normalise(query);
  if (!q) return [];
  const starts = [], contains = [];
  for (const s of state.stations) {
    if (state.guesses.includes(s.slug)) continue;   // already tried; don't offer it again
    const idx = s.search.indexOf(q);
    if (idx === 0) starts.push(s);
    else if (idx > 0) contains.push(s);
    if (starts.length >= 8) break;
  }
  return starts.concat(contains).slice(0, 8);
}

function renderSuggestions() {
  const list = state.matches;
  els.suggestions.innerHTML = "";
  if (!list.length) {
    els.suggestions.hidden = true;
    els.input.setAttribute("aria-expanded", "false");
    return;
  }
  list.forEach((s, i) => {
    const li = document.createElement("li");
    li.id = `sugg-${i}`;
    li.setAttribute("role", "option");
    li.setAttribute("aria-selected", String(i === state.highlighted));
    // A slim bar in the station's first line colour, as a glanceable cue.
    li.innerHTML = `<span class="rail" style="background:${LINE_COLOURS[s.lines[0]] || "#555"}"></span>${s.name}`;
    li.addEventListener("mousedown", (e) => { e.preventDefault(); submitGuess(s.slug); });
    els.suggestions.appendChild(li);
  });
  els.suggestions.hidden = false;
  els.input.setAttribute("aria-expanded", "true");
  const active = list[state.highlighted];
  els.input.setAttribute("aria-activedescendant", active ? `sugg-${state.highlighted}` : "");
}

function closeSuggestions() {
  state.matches = [];
  state.highlighted = -1;
  renderSuggestions();
}

/* ------------------------------------------------------------ game flow --- */

function submitGuess(slug) {
  if (state.status !== "playing") return;
  if (!state.bySlug.has(slug) || state.guesses.includes(slug)) return;

  state.guesses.push(slug);
  if (slug === state.answer.slug) state.status = "won";
  else if (state.guesses.length >= MAX_GUESSES) state.status = "lost";

  els.input.value = "";
  closeSuggestions();
  if (state.status !== "playing") {
    els.input.disabled = true;
    document.querySelector(".search").hidden = true;
    els.inputHint.hidden = true;
  }
  render();
  // TODO(p5): persist today's guesses to localStorage so a refresh resumes.
}

function onInput() {
  state.matches = findMatches(els.input.value);
  state.highlighted = state.matches.length ? 0 : -1;
  renderSuggestions();
}

function onKeyDown(e) {
  if (state.status !== "playing") return;
  const n = state.matches.length;
  if (e.key === "ArrowDown" && n) {
    e.preventDefault();
    state.highlighted = (state.highlighted + 1) % n;
    renderSuggestions();
  } else if (e.key === "ArrowUp" && n) {
    e.preventDefault();
    state.highlighted = (state.highlighted - 1 + n) % n;
    renderSuggestions();
  } else if (e.key === "Enter") {
    e.preventDefault();
    // Enter only ever commits a highlighted suggestion — never raw text, so a
    // misspelling can't be submitted and argued about.
    if (state.highlighted >= 0) submitGuess(state.matches[state.highlighted].slug);
    else els.inputHint.textContent = "Choose a station from the list.";
  } else if (e.key === "Escape") {
    closeSuggestions();
  }
}

/* ----------------------------------------------------------------- boot --- */

async function start() {
  let data;
  try {
    const res = await fetch("data/stations.json");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
  } catch (err) {
    els.inputHint.textContent =
      "Could not load the station list. If you opened this file directly, serve it instead: python3 -m http.server";
    console.error(err);
    return;
  }

  state.lines = data.lines;
  state.stations = data.stations.map((s) => ({ ...s, search: normalise(s.name) }));
  state.stations.sort((a, b) => a.name.localeCompare(b.name));
  state.bySlug = new Map(state.stations.map((s) => [s.slug, s]));

  state.answer = state.bySlug.get(PUZZLE.slug);
  if (!state.answer) { els.inputHint.textContent = "Puzzle station not found."; return; }

  els.puzzleNo.textContent = `Puzzle #${PUZZLE.number}`;

  // Warm the next sharper level so the swap after a wrong guess is instant.
  const preload = new Image();
  preload.src = `maps/${state.answer.slug}/2.webp`;

  els.input.addEventListener("input", onInput);
  els.input.addEventListener("keydown", onKeyDown);
  els.input.addEventListener("blur", () => setTimeout(closeSuggestions, 120));

  render();
}

start();
</script>
</body>
</html>
